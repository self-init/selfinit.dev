[project]
name = "selfinit-site"
version = "0.1.0"
description = "self-init: William Anderson's blog and the static site generator that builds it"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pillow>=13.0.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0",
]

[tool.uv]
# This is an application, not a library: don't build/install it as a package.
package = false
